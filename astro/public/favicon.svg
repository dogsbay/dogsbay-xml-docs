<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!--
    Drawn, not traced. The photographic source was pale mint on white and
    its glass texture survived any threshold as speckle.

    FILLED, not stroked. An outlined version read as a face at size: the
    negative space between the toes and the pad became two eyes and a
    mouth once adjacent strokes merged.

    Toes sit slightly high and the pad slightly low so the gaps survive
    downsampling — at 16px a tighter arrangement fuses the toes into a
    single bar.

    Theme-aware: the browser composites a favicon against the tab strip,
    so one fixed colour disappears on either a light or a dark UI.
  -->
  <style>
    .paw { fill: #1e6e7d; }
    @media (prefers-color-scheme: dark) { .paw { fill: #7fd3e0; } }
  </style>
  <g class="paw">
    <ellipse cx="14.5" cy="29.5" rx="6.3" ry="8.6" transform="rotate(-22 14.5 29.5)"/>
    <ellipse cx="26" cy="17.5" rx="6.3" ry="9.2" transform="rotate(-8 26 17.5)"/>
    <ellipse cx="40" cy="17.5" rx="6.3" ry="9.2" transform="rotate(8 40 17.5)"/>
    <ellipse cx="51.5" cy="29.5" rx="6.3" ry="8.6" transform="rotate(22 51.5 29.5)"/>
    <path d="M32 36c9.8 0 16.8 6.8 16.8 13.8S41.8 59.5 32 59.5 15.2 54.3 15.2 47.3 22.2 36 32 36Z"/>
  </g>
</svg>
